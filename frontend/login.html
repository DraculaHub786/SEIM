<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM Platform - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="glass-panel p-8 rounded-xl w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500 flex items-center justify-center gap-3">
                <i class="fas fa-shield-halved"></i> SIEM Portal
            </h1>
            <p class="text-slate-400 mt-2">Sign in to access your dashboard</p>
        </div>

        <div id="error-message" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-lg mb-4 text-sm text-center">
            <!-- Error messages injected here -->
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3 top-3 text-slate-500"></i>
                    <input type="text" id="username" required 
                           class="w-full bg-slate-900/50 border border-slate-700/50 rounded-lg py-2.5 pl-10 pr-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                           placeholder="admin">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="password" required 
                           class="w-full bg-slate-900/50 border border-slate-700/50 rounded-lg py-2.5 pl-10 pr-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-500 hover:to-blue-400 text-white font-medium py-2.5 rounded-lg transition-all shadow-[0_0_15px_rgba(99,102,241,0.3)] hover:shadow-[0_0_20px_rgba(99,102,241,0.5)] flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fas fa-arrow-right text-sm"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-slate-400">
                Don't have an account? 
                <a href="/register" class="text-indigo-400 hover:text-indigo-300 transition-colors">Register here</a>
            </p>
        </div>
    </div>

    <!-- Auth script -->
    <script src="js/auth.js"></script>
</body>
</html>
